name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest -m "not integration" --cov=meridian_storage.adapters.s3 --cov-report=term-missing --cov-report=xml
      - run: python -m bandit -q -r src
      - run: python -m pip_audit --local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  compatibility:
    name: python-${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not integration" -q

  package:
    name: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Build twice from the same commit
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --outdir .build-a
          python -m build --outdir .build-b
          diff -rq .build-a .build-b
      - name: Smoke-install the wheel and verify discovery
        run: |
          python -m pip install --force-reinstall .build-a/*.whl
          python - <<'PY'
          from importlib.metadata import entry_points, version
          from meridian_storage.adapters.s3 import __version__

          assert version("meridian-storage-s3") == "1.0.1"
          assert __version__ == "1.0.1"
          selected = tuple(entry_points(group="meridian_storage.adapters", name="s3"))
          assert len(selected) == 1
          assert selected[0].load().adapter_id == "s3"
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: .build-a/*
          include-hidden-files: true
          if-no-files-found: error

  real-s3-conformance:
    name: real-s3-conformance
    runs-on: ubuntu-24.04
    env:
      MERIDIAN_S3_ENDPOINT: http://127.0.0.1:19000
      MERIDIAN_S3_ACCESS_KEY: meridian-conformance
      MERIDIAN_S3_SECRET_KEY: meridian-conformance-secret
      MERIDIAN_S3_ENGINE_RELEASE: RELEASE.2025-04-22T22-12-26Z
      MERIDIAN_S3_ENGINE_DIGEST: sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
      MERIDIAN_S3_EVIDENCE_PATH: /tmp/meridian-s3-conformance-report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Start immutable real S3-compatible engine
        run: |
          docker run --rm -d --name meridian-s3-minio \
            -p 19000:9000 \
            -e MINIO_ROOT_USER="$MERIDIAN_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MERIDIAN_S3_SECRET_KEY" \
            "minio/minio@$MERIDIAN_S3_ENGINE_DIGEST" server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$MERIDIAN_S3_ENDPOINT/minio/health/ready"; then
              exit 0
            fi
            sleep 1
          done
          docker logs meridian-s3-minio
          exit 1
      - run: python -m pytest -q tests/integration/test_minio_conformance.py
      - name: Verify committed evidence is reproducible
        run: cmp evidence/conformance-report.json "$MERIDIAN_S3_EVIDENCE_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-s3-conformance-report
          path: /tmp/meridian-s3-conformance-report.json
          if-no-files-found: error
