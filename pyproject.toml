[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-storage-s3"
version = "1.0.0"
description = "S3 object adapter for the Meridian V1 Object Catalog"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Meridian contributors" }]
keywords = ["meridian", "object-storage", "s3", "adapter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "boto3>=1.40,<2",
  "meridian-storage-object-common==1.0.0",
]

[project.optional-dependencies]
test = [
  "bandit[toml]>=1.8,<2",
  "build==1.3.0",
  "hatchling==1.27.0",
  "moto[s3]>=5.1,<6",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/zephytiju/MeridianS3Adapter"
Documentation = "https://github.com/zephytiju/MeridianS3Adapter#readme"
Issues = "https://github.com/zephytiju/MeridianS3Adapter/issues"
Repository = "https://github.com/zephytiju/MeridianS3Adapter.git"

[project.entry-points."meridian_storage.adapters"]
s3 = "meridian_storage.adapters.s3.factory:S3AdapterFactory"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/evidence",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "integration: requires an authenticated disposable S3-compatible endpoint",
]

[tool.coverage.run]
branch = true
source = ["meridian_storage.adapters.s3"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meridian_storage.adapters.s3"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PT", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
